<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RepoRoast: Authoritative code review grounded in AST static analysis, Tree-Sitter syntax inspection, and senior engineering critique." />
    <meta name="theme-color" content="#F3F4F1" />
    <meta property="og:title" content="RepoRoast" />
    <meta property="og:description" content="Authoritative code review grounded in AST static analysis and senior engineering critique." />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RepoRoast" />
    <meta name="twitter:description" content="Authoritative code review grounded in AST static analysis and senior engineering critique." />
    <meta name="twitter:image" content="/og-image.svg" />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    
    <!-- Optimize Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    
    <title>RepoRoast</title>
  </head>
  <body>
    <div id="root">
      <style>
        .initial-loader {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #F3F4F1;
        }
        .initial-loader svg {
          width: 48px;
          height: 48px;
          animation: breathe 2.4s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }
        @keyframes breathe {
          0%, 100% {
            transform: scale(1);
            opacity: 0.92;
          }
          50% {
            transform: scale(1.06);
            opacity: 1;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .initial-loader svg {
            animation: none;
          }
        }
      </style>
      <div class="initial-loader">
        <svg width="48" height="48" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="RepoRoast">
          <path d="M 12 5 L 5 12 L 5 20 L 12 27" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 20 5 L 27 12 L 27 20 L 20 27" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 16 4 L 20 11 L 19 18 L 16 25 L 13 18 L 12 11 Z" fill="#D1301C"/>
          <path d="M 16 10 L 18 14 L 16 18 L 14 14 Z" fill="#F3F4F1"/>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
