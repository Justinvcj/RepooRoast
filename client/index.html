    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RepoRoast: Authoritative code review grounded in AST static analysis, Tree-Sitter syntax inspection, and senior engineering critique." />
    <meta name="theme-color" content="#0B0D14" />
    <meta property="og:title" content="RepoRoast" />
    <meta property="og:description" content="Authoritative code review grounded in AST static analysis and senior engineering critique." />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    
    <!-- Optimize Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    
    <title>RepoRoast</title>
  </head>
  <body>
    <div id="root">
      <style>
        .initial-loader {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #0B0D14;
        }
        .initial-loader svg {
          width: 48px;
          height: 48px;
          animation: breathe 2.4s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }
        @keyframes breathe {
          0%, 100% {
            transform: scale(1);
            opacity: 0.92;
          }
          50% {
            transform: scale(1.06);
            opacity: 1;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .initial-loader svg {
            animation: none;
          }
        }
      </style>
      <div class="initial-loader">
        <svg width="48" height="48" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="RepoRoast"><rect x="8" y="6" width="16" height="4" rx="2" fill="#EEF0F5"/><rect x="13" y="14" width="14" height="4" rx="2" fill="#FF6B3D"/><rect x="8" y="22" width="10" height="4" rx="2" fill="#EEF0F5"/><rect x="2" y="11" width="3" height="10" rx="1.5" fill="#FF6B3D"/></svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
